<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>413 — Berkas Terlalu Besar</title>
<style>
:root { --accent: #f08c00; --accent-soft: #fff9db; }
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #f4f7fe; color: #1a1a2e;
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.bg span { position: absolute; border-radius: 50%; background: var(--accent-soft); opacity: .7; }
.bg span:nth-child(1) { width: 420px; height: 420px; top: -160px; left: -120px; }
.bg span:nth-child(2) { width: 320px; height: 320px; bottom: -140px; right: -100px; }
.bg span:nth-child(3) { width: 180px; height: 180px; top: 55%; left: 8%; opacity: .4; }
.card {
    position: relative; z-index: 1; background: #fff; border-radius: 22px; padding: 44px 40px;
    box-shadow: 0 18px 45px rgba(23, 43, 77, .10); text-align: center; max-width: 460px; width: 100%;
}
.art { width: 150px; height: 120px; margin: 0 auto 22px; display: block; animation: float 4.5s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@media (prefers-reduced-motion: reduce) { .art { animation: none; } }
.code { font-size: 3.4rem; font-weight: 700; line-height: 1; color: var(--accent); letter-spacing: -.02em; }
h1 { font-size: 1.35rem; font-weight: 700; margin: 10px 0 8px; }
p { font-size: 1rem; color: #667085; line-height: 1.6; margin: 0 0 20px; }
.tips { text-align: left; background: #fff9db; border-radius: 12px; padding: 14px 18px; margin: 0 0 26px; }
.tips li { font-size: .9rem; color: #7a5b00; line-height: 1.7; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 12px;
    text-decoration: none; font-weight: 600; font-size: .95rem; border: none; cursor: pointer;
    font-family: inherit; transition: transform .15s, background .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #d67c00; transform: translateY(-2px); }
.btn-ghost { background: #f1f3f5; color: #495057; }
.btn-ghost:hover { background: #e9ecef; transform: translateY(-2px); }
@media (max-width: 480px) {
    .card { padding: 34px 24px; } .code { font-size: 2.8rem; } .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>
<div class="card">
    <svg class="art" viewBox="0 0 150 120" fill="none" aria-hidden="true">
        <ellipse cx="75" cy="108" rx="40" ry="7" fill="#f08c00" opacity=".12"/>
        <rect x="40" y="34" width="70" height="58" rx="9" fill="none" stroke="#f08c00" stroke-width="6"/>
        <circle cx="60" cy="53" r="6" fill="#f08c00"/>
        <path d="M44 82 L66 62 L82 78 L94 68 L106 80" fill="none" stroke="#f08c00" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M112 26 L128 42 M128 26 L112 42" stroke="#f08c00" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div class="code">413</div>
    <h1>Berkas Terlalu Besar</h1>
    <p>Foto yang Anda unggah melebihi batas ukuran yang diizinkan server.</p>
    <ul class="tips">
        <li>Batas maksimal <strong>5 MB</strong> per gambar.</li>
        <li>Format yang didukung: JPG, PNG, dan WebP.</li>
        <li>Foto dari kamera HP biasanya perlu dikecilkan lebih dulu.</li>
    </ul>
    <div class="actions">
        <button class="btn btn-primary" onclick="history.back()">&larr; Coba Lagi</button>
        <a class="btn btn-ghost" href="https://aptpairport.id/">Beranda</a>
    </div>
</div>
</body>
</html>
