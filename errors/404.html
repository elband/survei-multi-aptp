<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Halaman Tidak Ditemukan</title>
<style>
:root { --accent: #1971c2; --accent-soft: #e7f5ff; }
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #f4f7fe; color: #1a1a2e;
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.bg span {
    position: absolute; border-radius: 50%; background: var(--accent-soft); opacity: .55;
}
.bg span:nth-child(1) { width: 420px; height: 420px; top: -160px; left: -120px; }
.bg span:nth-child(2) { width: 320px; height: 320px; bottom: -140px; right: -100px; }
.bg span:nth-child(3) { width: 180px; height: 180px; top: 55%; left: 8%; opacity: .35; }
.card {
    position: relative; z-index: 1; background: #fff; border-radius: 22px; padding: 44px 40px;
    box-shadow: 0 18px 45px rgba(23, 43, 77, .10); text-align: center;
    max-width: 460px; width: 100%;
}
.art { width: 150px; height: 120px; margin: 0 auto 22px; display: block; animation: float 4.5s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@media (prefers-reduced-motion: reduce) { .art { animation: none; } }
.code { font-size: 3.4rem; font-weight: 700; line-height: 1; color: var(--accent); letter-spacing: -.02em; }
h1 { font-size: 1.35rem; font-weight: 700; margin: 10px 0 8px; }
p { font-size: 1rem; color: #667085; line-height: 1.6; margin: 0 0 28px; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 12px;
    text-decoration: none; font-weight: 600; font-size: .95rem; transition: transform .15s, background .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #155fa0; transform: translateY(-2px); }
.btn-ghost { background: #f1f3f5; color: #495057; }
.btn-ghost:hover { background: #e9ecef; transform: translateY(-2px); }
@media (max-width: 480px) {
    .card { padding: 34px 24px; } .code { font-size: 2.8rem; } .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>

        <path d="M88 76 L108 96" stroke="#1971c2" stroke-width="8" stroke-linecap="round"/>
        <path d="M56 48 h.01 M76 48 h.01" stroke="#1971c2" stroke-width="7" stroke-linecap="round"/>
        <path d="M56 66 q10 -8 20 0" stroke="#1971c2" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="code">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Alamat yang Anda buka tidak ada atau sudah dipindahkan. Periksa kembali tautannya, atau kembali ke beranda.</p>

        <a class="btn btn-primary" href="/">&larr; Kembali ke Beranda</a>

</div>
