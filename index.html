<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survei Bandara A.P.T. Pranoto</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-container">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <img src="https://aptpairport.id/assets_landing/img/logo/logo-apt.svg" alt="APT Pranoto Logo" class="logo">
            <h1>Survei Pengembangan Penerbangan</h1>
            <p>Bandar Udara A.P.T. Pranoto - Samarinda</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
                <div class="steps-wrapper">
                    <div class="step-indicator active" data-step="1">1</div>
                    <div class="step-indicator" data-step="2">2</div>
                    <div class="step-indicator" data-step="3">3</div>
                    <div class="step-indicator" data-step="4">4</div>
                </div>
            </div>
        </header>

        <form id="surveyForm" class="survey-form">
            <!-- Dynamic Form Steps Container -->
            <div id="dynamic-form-container"></div>

            <!-- Footer Controls -->
            <div class="form-footer">
                <button type="button" id="btn-prev" class="btn btn-secondary hidden"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button>
                <div class="spacer"></div>
                <button type="button" id="btn-next" class="btn btn-primary">Selanjutnya <i class="fa-solid fa-arrow-right"></i></button>
                <button type="submit" id="btn-submit" class="btn btn-success hidden"><i class="fa-solid fa-paper-plane"></i> Kirim Survei</button>
            </div>
        </form>

        <div id="success-message" class="success-message hidden">
            <div class="icon-wrapper">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2>Terima Kasih!</h2>
            <p>Tanggapan Anda telah berhasil dikirimkan. Masukan Anda sangat berarti bagi pengembangan Bandar Udara A.P.T. Pranoto.</p>
            <button class="btn btn-primary mt-4" onclick="location.reload()">Isi Survei Lain</button>
        </div>
    </div>

    <!-- Script -->
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
