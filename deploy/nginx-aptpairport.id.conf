# ============================================================================
#  aptpairport.id — Aplikasi Survei APT Pranoto di AKAR DOMAIN
#
#  Pasang sebagai: /etc/nginx/sites-available/aptpairport.id
#  Aktifkan:       ln -s ../sites-available/aptpairport.id /etc/nginx/sites-enabled/
#
#  Ganti dua hal sebelum dipakai:
#    1. PHP_SOCK  — sesuaikan versi PHP-FPM (cek: ls /run/php/*.sock)
#    2. Blok SSL  — biarkan certbot yang mengisinya (lihat INSTALL.md langkah 7)
#
#  Tata letak yang diasumsikan:
#    /var/www/aptpairport.id/survei/       <- document root (isi repo ini)
#    /var/www/aptpairport.id/survei.env    <- kredensial, DI LUAR document root
# ============================================================================

# --- HTTP: hanya untuk validasi certbot + redirect ke HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name aptpairport.id www.aptpairport.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://aptpairport.id$request_uri;
    }
}

# --- www -> non-www --------------------------------------------------------
server {
    # Bentuk "listen ... http2" dipakai, bukan "http2 on;" — direktif itu baru
    # ada di Nginx 1.25.1, sedangkan Debian 12 masih 1.22 dan akan menolaknya.
    listen 443 ssl http2;
    server_name www.aptpairport.id;

    # ssl_certificate / ssl_certificate_key diisi certbot
    return 301 https://aptpairport.id$request_uri;
}

# --- Situs utama -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aptpairport.id;

    root  /var/www/aptpairport.id/survei;
    index index.php;

    # ssl_certificate / ssl_certificate_key diisi certbot

    access_log /var/log/nginx/aptpairport.id.access.log;
    error_log  /var/log/nginx/aptpairport.id.error.log;

    # Default Nginx cuma 1 MB — upload foto 5 MB akan ditolak 413 sebelum
    # PHP sempat melihatnya sama sekali.
    client_max_body_size 6M;

    # --- Halaman error berlogo --------------------------------------------
    # "internal" membuat /errors/404.html tidak bisa dibuka langsung lewat URL,
    # tapi tetap bisa dipakai sebagai target error_page.
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 413 /errors/413.html;
    error_page 500 502 503 504 /errors/50x.html;
    location ^~ /errors/ {
        internal;
    }

    # --- Berkas yang tidak boleh diunduh siapa pun -------------------------
    # .env, .git, .htaccess, dsb. Pengecualian .well-known untuk certbot.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Skema SQL, dokumentasi, dan skrip deploy ikut ter-clone — jangan disajikan.
    location ^~ /database/ { deny all; }
    location ~* \.(sql|md|sh|log|bak|ini|yml|yaml)$ { deny all; }

    # --- Folder upload: file statis boleh, skrip HARAM --------------------
    # Tanda "^~" wajib. Tanpa itu "location ~ \.php$" di bawah tetap menang
    # dan .php yang berhasil diselundupkan ke uploads/ akan tereksekusi.
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar|phps|cgi|pl|py|sh)$ {
            deny all;
        }
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- Aset statis -------------------------------------------------------
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Routing utama -----------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # snippets/fastcgi-php.conf sudah memuat "try_files $fastcgi_script_name =404"
        # — menambah try_files sendiri di sini membuat "nginx -t" gagal (duplikat).
        include snippets/fastcgi-php.conf;

        # Sesuaikan versi PHP: ls /run/php/*.sock
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        fastcgi_read_timeout 120s;
    }

    # --- Header keamanan ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "same-origin"    always;
}
