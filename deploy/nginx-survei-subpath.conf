# ============================================================================
#  Blok Nginx untuk Aplikasi Survei di SUB-PATH  https://aptpairport.id/survei/
#
#  Tempelkan SELURUH isi berkas ini ke DALAM server block yang sudah melayani
#  aptpairport.id (di antara "server {" dan "}" penutupnya). install.sh
#  melakukannya otomatis; berkas ini rujukan kalau mau memasang manual.
#
#  Situs utama di "/" TIDAK disentuh sama sekali — mau ia proxy_pass ke Next.js
#  atau menyajikan berkas statis, tidak ada bedanya. Blok ini hanya mengambil
#  alih URL yang diawali "/survei/".
#
#  Tata letak yang diasumsikan:
#    /var/www/survei.env                <- kredensial, di luar semua document root
#    /var/www/aptpairport.id/survei/    <- isi repo ini
#
#  Kenapa "root /var/www/aptpairport.id" dan bukan "alias"?
#    Karena nama folder terakhirnya ("survei") sama persis dengan sub-path URL,
#    "root" memetakan /survei/x.php -> /var/www/aptpairport.id/survei/x.php
#    dengan sendirinya. "alias" bekerja juga, tapi merusak $document_root
#    sehingga SCRIPT_FILENAME milik PHP jadi salah — sumber bug klasik.
#
#  Ganti sebelum dipakai: versi socket PHP-FPM di baris fastcgi_pass.
# ============================================================================

    # ===== survei: mulai =====

    location ^~ /survei/ {
        root /var/www/aptpairport.id;
        index index.php;

        # Default Nginx cuma 1 MB — upload foto 5 MB akan ditolak 413 sebelum
        # PHP sempat melihatnya. Hanya berlaku untuk /survei/, bukan situs utama.
        client_max_body_size 6M;

        # Halaman error berlogo milik aplikasi survei.
        error_page 403 /survei/errors/403.html;
        error_page 404 /survei/errors/404.html;
        error_page 413 /survei/errors/413.html;
        error_page 500 502 503 504 /survei/errors/50x.html;

        # --- URUTAN DI BAWAH INI PENTING ---------------------------------
        # Nginx menguji location regex bersarang sesuai urutan penulisan.
        # Aturan penolakan harus berada di ATAS aturan yang menjalankan PHP.

        # Halaman error hanya boleh dipakai internal, tidak dibuka langsung.
        location ^~ /survei/errors/ {
            internal;
        }

        # Kredensial, .git, dan berkas kerja tidak boleh diunduh siapa pun.
        location ~ /\. {
            deny all;
        }
        location ^~ /survei/database/ {
            deny all;
        }
        location ~* ^/survei/.*\.(sql|md|sh|log|bak|ini|yml|yaml)$ {
            deny all;
        }

        # Folder upload: berkas statis boleh disajikan, skrip HARAM.
        #
        # Aturan deny WAJIB bersarang di dalam blok ini, bukan sejajar dengannya.
        # Begitu Nginx memilih prefix "^~ /survei/uploads/" (prefix terpanjang,
        # dan bertanda ^~), semua location regex sejajar DILEWATI — termasuk
        # aturan deny-nya. Diuji: versi sejajar menyajikan .php di uploads/
        # sebagai teks mentah dengan HTTP 200. Versi bersarang ini 403.
        location ^~ /survei/uploads/ {
            location ~* \.(php|phtml|phar|phps|cgi|pl|py|sh)$ {
                deny all;
            }
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location ^~ /survei/assets/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # --- Eksekusi PHP -------------------------------------------------
        location ~ ^/survei/.+\.php$ {
            # "root" diwarisi dari location induk, ditulis ulang agar jelas.
            root /var/www/aptpairport.id;

            # snippets/fastcgi-php.conf bawaan Debian sudah memuat
            # "try_files $fastcgi_script_name =404" — menambah try_files sendiri
            # di sini membuat "nginx -t" gagal dengan "directive is duplicate".
            include snippets/fastcgi-php.conf;

            # Sesuaikan versi PHP: ls /run/php/*.sock
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_read_timeout 120s;
        }

        try_files $uri $uri/ =404;
    }

    # Membuka /survei tanpa garis miring: arahkan ke /survei/ supaya path
    # relatif di dalam halaman (assets/, admin.php) tetap terhitung benar.
    location = /survei {
        return 301 /survei/;
    }

    # ===== survei: selesai =====
