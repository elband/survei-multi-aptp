<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin Survei</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        .login-container form {
            text-align: left;
        }
        .error-msg {
            color: var(--error);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="background-container"></div>
    <div class="app-container login-container">
        <header class="app-header" style="margin-bottom: 20px;">
            <img src="https://aptpairport.id/assets_landing/img/logo/logo-apt.svg" alt="APT Pranoto Logo" class="logo">
            <h1>Admin Login</h1>
        </header>

        <div id="error-msg" class="error-msg">Username atau password salah!</div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Masuk <i class="fa-solid fa-right-to-bracket"></i></button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            const btn = e.target.querySelector('button');
            const origText = btn.innerHTML;
            btn.innerHTML = 'Loading...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('admin_token', data.token);
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = data.message;
                }
            } catch (err) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Terjadi kesalahan koneksi.';
            } finally {
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
